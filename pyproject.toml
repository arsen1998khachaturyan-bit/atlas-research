[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-research"
version = "1.0.0"
description = "Query-efficient symbolic extraction from black-box behavior"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
